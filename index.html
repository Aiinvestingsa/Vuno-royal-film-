<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUNO ROYAL AI MOVIE MAKER - FIXED CUTOUT</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}
body{background:#0a0a0a;color:#fff;margin:0;padding:0 16px 80px}
header{background:#111;padding:16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:900;color:#FFD700}
.card{background:#181818;border-radius:16px;padding:18px;margin:14px 0;border:1px solid #2a2a2a}
input,textarea,select{width:100%;background:#222;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin:6px 0;font-size:15px}
input[type=range]{padding:0}
label{font-size:12px;color:#aaa}
.btn{background:#FFD700;color:#000;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
.btn2{background:#25D366;color:#000;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
.btnGhost{background:#222;color:#fff;border:1px solid #444;padding:12px;border-radius:12px;width:100%;cursor:pointer;margin-top:8px}
.btnCut{background:#7c3aed;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
.genres{display:flex;flex-wrap:wrap;gap:8px}
.genres button{background:#222;color:#fff;border:2px solid #333;padding:8px 14px;border-radius:20px;cursor:pointer}
.genres button.sel{background:#FFD700;color:#000}
.scene{background:#111;border-left:4px solid #FFD700;padding:14px;border-radius:12px;margin:12px 0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;background:#222;aspect-ratio:16/9}
.scene-wrap img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* ===== FIXED CUTOUT - Big, Sharp, Standing on Ground, Left Side ===== */
.cutout-layer{position:absolute;bottom:0;left:4%;width:48%;height:96%;object-fit:contain;object-position:bottom center;z-index:2;pointer-events:none;
/* NO BLUR ON FACE - Only soft drop shadow for blend */
filter:drop-shadow(0 0 3px rgba(0,0,0,0.5)) drop-shadow(0 8px 12px rgba(0,0,0,0.6));
}
.shadow-layer{position:absolute;bottom:1%;left:5%;width:46%;height:14px;background:radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, transparent 75%);border-radius:50%;z-index:1}
.char-label{position:absolute;bottom:8px;left:4%;background:#FFD700;color:#000;font-weight:800;font-size:12px;padding:5px 10px;border-radius:20px;z-index:4}
.char-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.85);color:#FFD700;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800;z-index:4}
.pill{display:inline-block;background:#222;padding:4px 10px;border-radius:20px;font-size:12px}
.small{font-size:13px;color:#aaa}
.checker{background:repeating-conic-gradient(#333 0% 25%, #111 0% 50%) 50% / 20px 20px}
.preview{width:100%;height:240px;object-fit:contain;border-radius:12px;background:#111}
canvas{display:none}
</style>
</head>
<body>
<header><div class="logo">VUNO ROYAL 👑<br><span>AI MOVIE MAKER</span></div><div>✅ FIXED</div></header>

<div class="card">
<h2 style="margin:0">Hi Vuno 👋 Make a film</h2>
<p class="small">FIXED: Big cutout • Sharp • Standing on ground • Left side • Blends nice</p>

<label>📸 Upload Your Photo</label>
<input type="file" id="charUpload" accept="image/*" onchange="uploadChar(event)">
<p class="small">BEFORE:</p><img id="beforeImg" class="preview" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80">
<p class="small">AFTER CUTOUT - Should be sharp, full body:</p><img id="afterImg" class="preview checker" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80">

<button class="btnCut" onclick="doCutout()">✂️ CUTOUT NOW - Fixed Sharp Cut</button>
<p class="small" id="cutStatus">Upload → Press CUTOUT → Sharp cut, no blur.</p>

<label>✨ BLEND - USE THESE EXACT SETTINGS FOR YOUR PHOTO</label>
<label>Edge Softness: <span id="softVal">6</span> - 6 = sharp + blends, 25 = blurry (don't use 25)</label>
<input type="range" id="edgeSoft" min="0" max="15" value="6" oninput="updateBlend()">
<label>Size in Scene: <span id="sizeVal">48</span>% - 48% = big, full body</label>
<input type="range" id="sizeAmt" min="35" max="60" value="48" oninput="updateBlend()">
<label>Position: <span id="posVal">4</span>% - 4% = left side, standing</label>
<input type="range" id="posAmt" min="0" max="50" value="4" oninput="updateBlend()">
<label>Color Match</label>
<select id="matchMode" onchange="updateBlend()">
<option value="auto">AUTO - Sunset=warm, Night=dark (Best for blend)</option>
<option value="off">OFF - Keep original (Will look pasted)</option>
</select>

<label>Your Film Idea</label>
<textarea id="idea" rows="2">A Durban boy finds a gold rock that talks and changes his family</textarea>
<label>Genre</label>
<div class="genres" id="genreList"></div><br>
<label>Main Character Name</label>
<input id="charName" value="Vuno">
<label>Setting</label>
<input id="setting" value="Durban, South Africa">
<button class="btn" onclick="makeFilm()">✨ GENERATE FILM - FIXED BLENDED CUTOUT</button>
<p class="small" id="status">Press CUTOUT first, then GENERATE.</p>
</div>

<div id="shareBox" style="display:none" class="card">
<h3>📤 Save & Share</h3>
<button class="btn" onclick="downloadVideo()">🎥 DOWNLOAD VIDEO</button>
<button class="btn2" onclick="shareWhatsApp()">💬 SHARE TO WHATSAPP</button>
<button class="btnGhost" onclick="copyLink()">📋 COPY CAPTION</button>
<p class="small" id="shareMsg"></p>
<p class="small" id="captionPreview"></p>
</div>

<div id="output"></div>
<canvas id="videoCanvas" width="1280" height="720"></canvas>
<canvas id="cutCanvas" width="600" height="900"></canvas>
<script>
let selGenre="Drama", currentFilm=null, episode=1, sceneImages=[];
let charImage="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80";
let cutoutImage=null;
let blendSettings={soft:6, size:48, pos:4, match:"auto"};
let genres=["Drama","Horror","Comedy","Sci-Fi","Romance","Action","Fantasy"];
let gl=document.getElementById('genreList');
genres.forEach(g=>{
  let b=document.createElement('button'); b.textContent=g;
  if(g==="Drama") b.className="sel";
  b.onclick=()=>{selGenre=g; document.querySelectorAll('#genreList button').forEach(x=>x.className=""); b.className="sel";};
  gl.appendChild(b);
});
function uploadChar(event){
  let file=event.target.files[0]; if(!file) return;
  let reader=new FileReader();
  reader.onload=function(e){
    let img=new Image();
    img.onload=function(){
      // Keep HIGH quality - no resize blur. Max 1000px, keep sharp.
      let maxW=1000; let scale=Math.min(1, maxW/img.width);
      let cw=Math.floor(img.width*scale), ch=Math.floor(img.height*scale);
      let c=document.createElement('canvas'); c.width=cw; c.height=ch;
      let ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0,cw,ch);
      charImage=c.toDataURL('image/jpeg',0.95);
      cutoutImage=null;
      document.getElementById('beforeImg').src=charImage;
      document.getElementById('afterImg').src=charImage;
      document.getElementById('cutStatus').textContent="✅ Photo uploaded sharp! Now press CUTOUT NOW.";
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function updateBlend(){
  blendSettings.soft=parseInt(document.getElementById('edgeSoft').value);
  blendSettings.size=parseInt(document.getElementById('sizeAmt').value);
  blendSettings.pos=parseInt(document.getElementById('posAmt').value);
  blendSettings.match=document.getElementById('matchMode').value;
  document.getElementById('softVal').textContent=blendSettings.soft;
  document.getElementById('sizeVal').textContent=blendSettings.size;
  document.getElementById('posVal').textContent=blendSettings.pos;
  document.querySelectorAll('.cutout-layer').forEach((el,i)=>{
    el.style.width=blendSettings.size+"%";
    el.style.left=blendSettings.pos+"%";
    // Only tiny soft shadow, NOT blur on face
    el.style.filter=getSceneFilter(i)+" drop-shadow(0 0 "+blendSettings.soft+"px rgba(0,0,0,0.35))";
  });
}
// FIXED CUT - Sharp, full body, no blur, person-shaped, not oval
function doCutout(){
  document.getElementById('cutStatus').textContent="✂️ Cutting sharp...";
  if(!charImage){ alert("Upload photo first!"); return; }
  let img=new Image();
  img.onload=function(){
    try{
      let canvas=document.getElementById('cutCanvas');
      let ctx=canvas.getContext('2d');
      canvas.width=600; canvas.height=900;
      ctx.clearRect(0,0,600,900);
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      // Draw FULL photo, no crop - keep full body, feet visible
      // Fit photo into canvas keeping ratio
      let scale=Math.min(600/img.width, 900/img.height);
      let dw=img.width*scale, dh=img.height*scale;
      let dx=(600-dw)/2, dy=(900-dh)/2;
      // Person-shaped clip - head + shoulders + body, wide enough, NOT tight oval
      ctx.save();
      ctx.beginPath();
      // Head - wide circle, don't cut hair
      ctx.moveTo(300,15);
      ctx.bezierCurveTo(390,15, 430,90, 430,190);
      ctx.bezierCurveTo(430,260, 380,295, 330,305);
      // Right shoulder - wide, don't cut arms
      ctx.bezierCurveTo(480,330, 540,450, 540,890);
      ctx.lineTo(60,890);
      ctx.bezierCurveTo(60,450, 120,330, 270,305);
      ctx.bezierCurveTo(220,295, 170,260, 170,190);
      ctx.bezierCurveTo(170,90, 210,15, 300,15);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
      // VERY LIGHT feather only on outer edge - 6px, not 25px blur
      ctx.globalCompositeOperation='destination-in';
      let grad=ctx.createRadialGradient(300,450,180,300,450,470);
      grad.addColorStop(0,'rgba(0,0,0,1)');
      grad.addColorStop(0.82,'rgba(0,0,0,1)');
      grad.addColorStop(0.96,'rgba(0,0,0,0.85)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grad;
      ctx.fillRect(0,0,600,900);
      ctx.globalCompositeOperation='source-over';
      let out=canvas.toDataURL('image/png');
      cutoutImage=out;
      document.getElementById('afterImg').src=out;
      document.getElementById('cutStatus').textContent="✅ CUTOUT FIXED! Sharp, full body, feet visible, no blur. Now press GENERATE FILM.";
      alert("✅ CUTOUT FIXED!\n\nSharp, big, full body.\nNow press GENERATE FILM.");
    }catch(e){ alert("Cut failed: "+e.message); }
  };
  img.src=charImage;
}
function getSceneFilter(i){
  if(blendSettings.match==="off") return "none";
  let filters=[
    "sepia(0.28) saturate(1.25) brightness(1.08)", // Sunset warm - matches Scene 1
    "brightness(0.85) contrast(1.1) saturate(0.9)", // Secret dark - matches Scene 2 foggy castle
    "sepia(0.12) brightness(1.04) saturate(1.08)",
    "brightness(0.82) contrast(1.12) saturate(0.9)",
    "sepia(0.38) saturate(1.4) brightness(1.15)", // Gold
    "brightness(0.75) contrast(1.15) saturate(0.8)" // Night
  ];
  return filters[i % filters.length];
}
function getCaption(){
  let idea=document.getElementById('idea').value||"My film";
  return `🎬 NEW FILM: ${idea} 👑\nMade with VUNO ROYAL AI MOVIE MAKER - Cutout Blended!\n#VunoRoyal #VunoRoyalAIMovieMaker #Durban #FYP`;
}
let backgrounds=[
  "https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=1280&q=80",
  "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1280&q=80",
  "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1280&q=80",
  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280&q=80",
  "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=1280&q=80",
  "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1280&q=80"
];
function makeFilm(){
  if(!cutoutImage){
    if(!confirm("You haven't pressed CUTOUT yet. Use original photo?")) return;
    cutoutImage=charImage;
  }
  let idea=document.getElementById('idea').value||"A boy finds gold";
  let name=document.getElementById('charName').value||"Vuno";
  let setting=document.getElementById('setting').value||"Durban";
  currentFilm={idea,name,setting,genre:selGenre}; episode=1;
  let sceneTexts=[
    `OPENING - ${setting}. ${name} is walking home. Something strange happens.`,
    `THE SECRET - ${name} hides the secret. Tension builds.`,
    `THE TRUTH - Secret revealed. ${name} says: Bengithi bengingeve ngikuthanda wangiphoxa.`,
    `THE FIGHT - Villain arrives. ${name} must choose: money or family?`,
    `THE TURN - ${name} makes a brave choice. Gold, rock and love come together.`,
    `CLIFFHANGER - Knock on the door. Someone new is there. TO BE CONTINUED...`
  ];
  let sceneLabels=["OPENING","THE SECRET","THE TRUTH","THE FIGHT","THE TURN","CLIFFHANGER"];
  sceneImages=[];
  let html=`<div class="card"><h2>🎬 ${idea}</h2><p><span class="pill">${selGenre}</span> <span class="pill">✂️ Cutout: ${name}</span> <span class="pill">VUNO ROYAL 👑</span></p></div>`;
  sceneTexts.forEach((s,i)=>{
    let bg=backgrounds[i % backgrounds.length];
    let filter=getSceneFilter(i);
    sceneImages.push({img:bg, char:cutoutImage, text:s, filter});
    html+=`<div class="scene">
      <div class="scene-wrap">
        <img class="bg" src="${bg}">
        <div class="char-badge">SCENE ${i+1} / 6 • ${sceneLabels[i]}</div>
        <div class="shadow-layer"></div>
        <img class="cutout-layer" src="${cutoutImage}" style="width:${blendSettings.size}%;left:${blendSettings.pos}%;filter:${filter} drop-shadow(0 0 ${blendSettings.soft}px rgba(0,0,0,0.35))">
        <div class="char-label">👑 ${name} • ${sceneLabels[i]}</div>
      </div>
      <b>SCENE ${i+1} / 6 - ${sceneLabels[i]}</b><p>${s}</p>
      <p class="small">✂️ Sharp Cutout • 🎨 Color matched • 🌑 Shadow on ground • ✨ Edge soft ${blendSettings.soft}</p>
    </div>`;
  });
  document.getElementById('output').innerHTML=html;
  document.getElementById('shareBox').style.display='block';
  document.getElementById('captionPreview').innerText=getCaption();
  document.getElementById('status').textContent="✅ DONE! Fixed cutout - big, sharp, standing on ground, blended.";
  document.getElementById('output').scrollIntoView();
}
function shareWhatsApp(){ window.open(`https://wa.me/?text=${encodeURIComponent(getCaption())}`,"_blank"); }
function copyLink(){ navigator.clipboard.writeText(getCaption()); document.getElementById('shareMsg').textContent="✅ Copied!"; }
async function downloadVideo(){
  if(!currentFilm){ alert("Press GENERATE FILM first!"); return; }
  alert("🎥 Making video... Wait 15 sec.");
  let canvas=document.getElementById('videoCanvas'); let ctx=canvas.getContext('2d');
  let stream=canvas.captureStream(30); let recorder=new MediaRecorder(stream,{mimeType:'video/webm'}); let chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`VUNO-ROYAL-${currentFilm.name}-FIXED.webm`; a.click(); alert("✅ Video downloaded!"); };
  recorder.start();
  for(let i=0;i<sceneImages.length;i++){
    let img=new Image(); img.crossOrigin="anonymous";
    let charImg=new Image(); charImg.crossOrigin="anonymous";
    try{ img.src=sceneImages[i].img; await new Promise(res=>{ img.onload=res; img.onerror=res; setTimeout(res,3000); }); }catch(e){}
    try{ charImg.src=sceneImages[i].char; await new Promise(res=>{ charImg.onload=res; charImg.onerror=res; setTimeout(res,2000); }); }catch(e){}
    let start=Date.now();
    while(Date.now()-start<2500){
      ctx.fillStyle="#000"; ctx.fillRect(0,0,1280,720);
      try{ ctx.drawImage(img,0,0,1280,720); }catch(e){}
      ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.beginPath(); ctx.ellipse(280,680,220,18,0,0,Math.PI*2); ctx.fill();
      try{ ctx.drawImage(charImg, 60, 60, 480, 650); }catch(e){}
      if(i===0){ ctx.fillStyle="rgba(255,150,0,0.10)"; ctx.fillRect(60,60,480,650); }
      if(i===4){ ctx.fillStyle="rgba(255,215,0,0.14)"; ctx.fillRect(60,60,480,650); }
      if(i===3||i===5){ ctx.fillStyle="rgba(0,0,80,0.15)"; ctx.fillRect(60,60,480,650); }
      ctx.fillStyle="#FFD700"; ctx.font="bold 28px Arial"; ctx.fillText(`VUNO ROYAL 👑 ✂️ • SCENE ${i+1}/6`,
